<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Home - GyaanPath</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <div class="logo">Vedic Books</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Books</a>
            <a href="#">Categories</a>
            <a href="#">Profile</a>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Welcome to Vedic Library</h1>
        <p>Your spiritual and philosophical reading journey starts here.</p>

        <!-- Categories -->
        <div class="categories">
            <button class="category" onclick="showCategory('spiritual')">Spiritual</button>
            <button class="category" onclick="showCategory('philosophy')">Philosophy</button>
            <button class="category" onclick="showCategory('history')">History</button>
            <button class="category" onclick="showCategory('self-help')">Self-Help</button>
        </div>

        <!-- Book Cards -->
        <div id="book-list" class="book-list">
            <!-- Books will be dynamically inserted here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
